name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 自動で実行するのは公開リポジトリ（octavo）だけ。公開リポジトリの Actions は無料で、
# リリースのたびに main への push で Mac・Windows を含めて全部が実行される。
# 非公開の開発用リポジトリでは、Actions タブの「Run workflow」で手で実行したときだけ動く。

# テストは英語の原文を突き合わせる。ランナーのロケールが変わっても
# 揺れないように、ここで固定しておく（既定はロケール任せ）。
env:
  OCTAVO_LANG: en

jobs:
  test:
    if: github.repository == 'yoshida-kd/octavo' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # 版は setup.sh の PANDOC_VER / TYPST_VER から取る（2か所に書くとずれる）。
      # apt の pandoc は古いことがあり、Typst の書き出しが変わるので使わない。
      - name: Install pandoc
        run: |
          V=$(sed -n 's/^PANDOC_VER="\(.*\)".*/\1/p' setup.sh)
          curl -fsSL -o pandoc.deb "https://github.com/jgm/pandoc/releases/download/${V}/pandoc-${V}-1-amd64.deb"
          sudo apt-get install -y ./pandoc.deb
          pandoc --version | head -1

      # EndToEnd.test_typst_compiles_to_pdf が typst compile まで走る。
      - name: Install Typst
        run: |
          V=$(sed -n 's/^TYPST_VER="\(.*\)".*/\1/p' setup.sh)
          curl -sSL "https://github.com/typst/typst/releases/download/v${V}/typst-x86_64-unknown-linux-musl.tar.xz" | tar xJ
          sudo install -m 0755 typst-x86_64-unknown-linux-musl/typst /usr/local/bin/typst
          typst --version

      - name: Run unit tests
        run: python3 tests/test_octavo.py

  # pip で入れたときに同梱物（templates/）が付いてくるか。wheel の中では
  # octavo/templates/ に入るので、リポジトリを触らない場所で init から
  # 組版まで通して初めて確かめられる（paths.py の分岐がここで効く）。
  package:
    if: github.repository == 'yoshida-kd/octavo' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install pandoc
        run: |
          V=$(sed -n 's/^PANDOC_VER="\(.*\)".*/\1/p' setup.sh)
          curl -fsSL -o pandoc.deb "https://github.com/jgm/pandoc/releases/download/${V}/pandoc-${V}-1-amd64.deb"
          sudo apt-get install -y ./pandoc.deb

      - name: Install Typst
        run: |
          V=$(sed -n 's/^TYPST_VER="\(.*\)".*/\1/p' setup.sh)
          curl -sSL "https://github.com/typst/typst/releases/download/v${V}/typst-x86_64-unknown-linux-musl.tar.xz" | tar xJ
          sudo install -m 0755 typst-x86_64-unknown-linux-musl/typst /usr/local/bin/typst

      - name: Build the wheel
        run: |
          python3 -m pip install --quiet build
          python3 -m build
          ls -l dist

      # リポジトリの外で実行する。中だと repo 直下の templates/ を拾って
      # しまい、wheel に入っていなくても通ってしまう。
      - name: Install it and build a project from scratch
        run: |
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install --quiet dist/*.whl
          export PATH=/tmp/venv/bin:$PATH
          cd /tmp
          octavo --version
          octavo doctor || true
          # 拡張機能が読む形。version と、準備が要るかの判断に使う項目
          octavo doctor --json | python3 -c "import json,sys; d=json.load(sys.stdin); assert d['version'] and 'ready' in d and 'analysis' in d, d"
          # setup.sh は wheel の中から走る（--check なので何も入れない）
          octavo setup --check --no-r
          octavo init proj
          cd proj
          octavo new paper smoke
          octavo new slides deck
          octavo build --compile
          test -f build/pdf/smoke/main.pdf && test -f build/pdf/smoke.pdf
          test -f build/slides/deck.typ
          # 英語のプロジェクトも（ひな型は言語ごとに別のファイル）
          cd /tmp
          octavo init proj-en --lang en
          cd proj-en
          octavo new paper smoke
          octavo template list
          octavo build --compile
          test -f build/pdf/smoke/main.pdf && test -f build/pdf/smoke.pdf
          # 見本つき（既定は見本を置かない）。見本の論文がそのまま組める
          cd /tmp
          octavo init demo --example
          cd demo
          octavo new slides talk --example
          octavo build --compile --no-analysis
          test -f build/pdf/example-paper/main.pdf && test -f build/pdf/example-paper.pdf
          test -f build/slides/talk.pdf

      - uses: actions/upload-artifact@v4
        with:
          name: octavo-dist
          path: dist/*

  # 拡張機能の「セットアップ」と同じ道: clone の外に置いた setup.sh を空の環境で実行し、
  # R（CRAN）・renv・uv・octavo（PyPI）まで入ることを見る。そのあと、このブランチの
  # octavo を入れ直して、octavo env（uv の .venv と renv）→ 分析 → 組版を通す。
  setup:
    if: github.repository == 'yoshida-kd/octavo' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: setup.sh from outside a clone (as the extension runs it)
        run: |
          mkdir -p /tmp/ext
          cp setup.sh /tmp/ext/
          OCTAVO_LANG=en bash /tmp/ext/setup.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # setup.sh は PyPI の公開版を入れる。以下はこのブランチの octavo で確かめる
      - name: This branch's octavo
        run: uv tool install --force .

      - name: Everything the extension asks about is there
        run: |
          octavo doctor --json | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          print(d['missing'], d['analysis'])
          assert d['ready'], d['missing']
          assert all(d['analysis'].values()), d['analysis']
          "
          Rscript -e 'cat(getOption("repos"), "\n")' | grep packagemanager.posit.co

      - name: octavo env and the analysis
        run: |
          cd /tmp
          octavo init envproj --lang en --with analysis
          cd envproj
          echo 'numpy' >> requirements.txt
          octavo env
          test -f renv.lock
          .venv/bin/python -c 'import numpy'
          octavo analysis run
          octavo new paper smoke
          octavo build --compile --no-analysis
          test -f build/pdf/smoke/main.pdf && test -f build/pdf/smoke.pdf

  # Windows（Linux・macOS の次の扱い）。setup.ps1 を winget で本当に実行し、
  # このブランチの octavo に入れ替えて、テスト一式・octavo env・分析・組版を通す。
  windows:
    if: github.repository == 'yoshida-kd/octavo' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: setup.ps1 (winget)
        run: |
          $before = $env:Path -split ';'
          powershell -NoProfile -ExecutionPolicy Bypass -File setup.ps1
          # setup.ps1 が PATH に足した場所だけを、この先のステップに渡す（全部を渡すと
          # Microsoft Store の python の代役が setup-python の Python より前に来る）
          $machine = [Environment]::GetEnvironmentVariable('Path', 'Machine')
          $user = [Environment]::GetEnvironmentVariable('Path', 'User')
          ("$HOME\.local\bin;$machine;$user" -split ';') |
            Where-Object { $_ -and ($before -notcontains $_) -and ($_ -notlike '*WindowsApps*') } |
            ForEach-Object { $_ | Out-File -Append -Encoding utf8 $env:GITHUB_PATH }

      # Quarto が R の .qmd を組むのに要る（実際の使い方では octavo env が renv に入れる）
      - name: R packages for the knitr engine
        run: Rscript -e 'install.packages(c("knitr", "rmarkdown"), lib = Sys.getenv("R_LIBS_USER"), repos = "https://cloud.r-project.org")'

      - name: This branch's octavo
        run: uv tool install --force .

      - name: Everything the extension asks about is there
        run: |
          octavo doctor
          octavo doctor --json | python -c "import json,sys; d=json.load(sys.stdin); print(d['missing'], d['analysis']); assert d['ready'], d['missing']; assert all(d['analysis'].values()), d['analysis']"

      # BIZ UD と Inter（利用者のフォント）と游書体が、書いてある名前で Typst に見えること
      - name: Fonts are visible to Typst under the names octavo uses
        run: |
          typst fonts | Out-File -Encoding utf8 fonts.txt
          python -c "import sys; sys.path.insert(0, '.'); from octavo.backends.typst import FONTS, PLATFORM_FALLBACKS as P, OPTIONAL_FONTS as O; seen={l.strip() for l in open('fonts.txt', encoding='utf-8-sig')}; want={n for l, c in FONTS.values() for n in (l, *c)} - set(P['darwin']) - set(O) - {'Noto Serif CJK JP', 'Noto Sans CJK JP'}; lack=sorted(want-seen); print('missing:', lack or 'none'); sys.exit(1 if lack else 0)"

      # テストは関数を直に呼んで標準出力に日本語を書くので UTF-8 にする（octavo
      # コマンドとして動くときは cli.main が自分で UTF-8 に切り替える）
      - name: Run unit tests
        env:
          PYTHONUTF8: '1'
        run: python tests/test_octavo.py

      - name: A project from scratch outside the repo, with octavo env and the analysis
        run: |
          Set-Location $env:RUNNER_TEMP
          octavo init winproj --lang ja --with analysis
          Set-Location winproj
          octavo new paper smoke
          octavo new slides deck
          octavo env
          if (-not (Test-Path renv.lock)) { throw 'no renv.lock' }
          octavo analysis run
          octavo build --compile
          if (-not (Test-Path build\pdf\smoke\main.pdf)) { throw 'no PDF' }
          if (-not (Test-Path build\slides\deck.typ)) { throw 'no deck' }

  # macOS。setup.sh の Homebrew の道をそのまま実行し（pandoc・Typst・Quarto・
  # フォント）、テスト一式と、wheel からの init → 組版をリポジトリの外で通す。
  # 書体の名前（typst.FONTS）が Mac で本当にその名前で見えるかもここで確かめる。
  macos:
    if: github.repository == 'yoshida-kd/octavo' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: setup.sh (Homebrew)
        run: bash setup.sh

      # Quarto が R の .qmd を組むのに要る（実際の使い方では octavo env が renv に入れる）
      - name: R packages for the knitr engine
        run: |
          Rscript -e 'lib <- Sys.getenv("R_LIBS_USER"); dir.create(lib, recursive = TRUE, showWarnings = FALSE); install.packages(c("knitr", "rmarkdown"), lib = lib, repos = "https://cloud.r-project.org")'

      # 既定の書体とヒラギノ（最後の受け皿）が、書いてある名前で Typst に見えること
      - name: Fonts are visible to Typst under the names octavo uses
        run: |
          typst fonts > /tmp/fonts.txt
          python3 - <<'PY'
          import sys
          sys.path.insert(0, '.')
          from octavo.backends.typst import FONTS, PLATFORM_FALLBACKS
          seen = {l.strip() for l in open('/tmp/fonts.txt')}
          want = {n for latin, cjk in FONTS.values() for n in (latin, *cjk)}
          want -= set(PLATFORM_FALLBACKS['win32'])   # 游明朝・游ゴシックは Windows の受け皿
          lack = sorted(want - seen)
          print('missing:', lack or 'none')
          sys.exit(1 if lack else 0)
          PY

      - name: doctor gives Homebrew hints, not apt
        run: |
          python3 bin/octavo doctor | tee /tmp/doctor.txt || true
          ! grep -q 'apt ' /tmp/doctor.txt

      - name: Run unit tests
        run: python3 tests/test_octavo.py

      - name: Build the wheel, and a project from scratch outside the repo
        run: |
          python3 -m pip install --quiet build
          python3 -m build --wheel
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install --quiet dist/*.whl
          export PATH=/tmp/venv/bin:$PATH
          cd /tmp
          # 部品を init でまとめて置く道（--with）も通す
          octavo init proj --with analysis,paper=smoke,slides=deck,lecture=course
          cd proj
          octavo build --compile --no-analysis
          test -f build/pdf/smoke/main.pdf && test -f build/pdf/smoke.pdf
          test -f build/slides/deck.pdf
          test -f build/slides/course-slides-01.pdf

  # VS Code 拡張がコンパイルでき、.vsix にまとまるか。strict + noUnused* なので
  # 使われない変数1つでも落ちる。作った .vsix は artifact として落とせる。
  # Node 22 なのは @vscode/vsce の依存（@azure/*）が node >= 22 を要求するため。
  extension:
    if: github.repository == 'yoshida-kd/octavo' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode-extension
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json

      - name: Install dev dependencies
        run: npm ci

      # vsce package が vscode:prepublish（= npm run compile）も実行する。
      - name: Compile and package
        run: npx vsce package -o octavo.vsix

      - uses: actions/upload-artifact@v4
        with:
          name: octavo-vsix
          path: vscode-extension/octavo.vsix

  # 分析の側（Quarto + R + templates/analysis/common/analysis/octavo.R、Python 版は
  # octavo_helper.py）を実際に実行する。ここが通らないかぎり補助は「書いただけ」の状態なので、
  # 1つの job を丸ごとこれに充てている。
  analysis:
    if: github.repository == 'yoshida-kd/octavo' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install pandoc
        run: |
          V=$(sed -n 's/^PANDOC_VER="\(.*\)".*/\1/p' setup.sh)
          curl -fsSL -o pandoc.deb "https://github.com/jgm/pandoc/releases/download/${V}/pandoc-${V}-1-amd64.deb"
          sudo apt-get install -y ./pandoc.deb

      - uses: quarto-dev/quarto-actions/setup@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # Python の分析（PythonAnalysisEndToEnd）が .venv を作るのに要る
      - uses: astral-sh/setup-uv@v5

      # Quarto の knitr エンジンに要る。octavo.R 自体は素の R だけで動く。
      - name: Install R packages for the knitr engine
        run: install.packages(c("knitr", "rmarkdown"))
        shell: Rscript {0}

      - name: Show versions
        run: python3 bin/octavo doctor || true

      # AnalysisEndToEnd が Quarto と Rscript を見つけて走る。
      # 1回で済ませる（2回実行すると分析まで含めて時間が倍かかる）。
      # pipefail がないと `| tee` がテストの失敗を握り潰す（パイプの終了
      # コードは tee のもの）ので必須。
      - name: Run unit tests (analysis included)
        run: |
          set -o pipefail
          python3 tests/test_octavo.py 2>&1 | tee /tmp/out.txt
          if grep -q 'AnalysisEndToEnd.*skipped' /tmp/out.txt; then
            echo '分析の検証が飛ばされている。Quarto か R か uv が入っていない'
            exit 1
          fi
